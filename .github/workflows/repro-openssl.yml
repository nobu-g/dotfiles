name: repro-openssl

# Temporary workflow for verifying the test-linux fix on a real amd64 runner
# (see the `debug-actions-test-linux` skill). DELETE once the fix lands.
on:
  push:
    branches: [test-workflow]
  workflow_dispatch:

jobs:
  bundle-race:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [noapi]
        dist: [ubuntu, debian]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build docker image
        run: docker build . -f dockerfile/${{ matrix.dist }}.dockerfile -t dotfiles:${{ matrix.dist }}
      - name: Bundle race test (MODE=${{ matrix.mode }})
        run: >-
          docker run -i -u user -e MODE=${{ matrix.mode }}
          --mount type=bind,source=${{ github.workspace }},target=/home/user/dotfiles,readonly
          dotfiles:${{ matrix.dist }}
          bash /home/user/dotfiles/.github/repro/bundle-race.sh
