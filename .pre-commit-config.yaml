repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      # - id: shellcheck
      #   files: ^(bin|init)/
      #   types: [shell]
      - id: shfmt
        args: [-i, "2", -ci, -sr, -s]
        files: ^(bin|init)/
        types: [shell]
      # https://github.com/markdownlint/markdownlint/blob/main/docs/configuration.md
      - id: markdownlint
        args: [--rules, "~MD013,~MD022,~MD029,~MD032,~MD033"]

  - repo: https://github.com/ewhauser/shuck
    rev: v0.0.45
    hooks:
      - id: shuck
        files: ^\.zsh\.d/
        exclude: ^\.zsh\.d/\.p10k\.zsh$
        types_or: [file]
        args:
          - --ignore
          - C001,C002,C003,C005
          - --config
          - 'lint.per-file-shell = {"**" = "zsh"}'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
